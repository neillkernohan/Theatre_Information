{% extends "expenses/base.html" %}
{% block page %}
<div class="card mx-auto" style="max-width: 32rem">
  <div class="card-body">
    <h1 class="h4">Where should reimbursements go?</h1>
    <p class="text-muted">We'll send Interac e-Transfers to <strong>{{ current_user.email }}</strong> unless you enter a different address.</p>
    <form method="post">
      {% include "expenses/_csrf.html" %}
      <label class="form-label" for="etransfer_email">e-Transfer email</label>
      <input class="form-control mb-3" type="email" id="etransfer_email" name="etransfer_email" value="{{ record.etransfer_email if record and record.etransfer_email else '' }}" placeholder="{{ current_user.email }}">
      <button class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
